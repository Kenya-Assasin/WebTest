<!-- =========================================

========================================= -->

<header class="topbar">

    <!-- =========================
         LOGO
    ========================== -->
    <a href="index.html" class="brand">

        <div class="brand-mark">
            ✦
        </div>

        <div class="brand-text">

            <strong>MCA</strong>

            <span>
                MULTIVERSE CREATURE ARCHIVE
            </span>

        </div>

    </a>


    <!-- =========================
         MENU CHÍNH
    ========================== -->
    <nav class="main-nav">

        <!-- Trang chủ -->
        <a href="index.html"
           class="nav-link"
           data-page="home">

            <span class="nav-icon">⌂</span>

            <span class="nav-text">
                Trang chủ
            </span>

        </a>


        <!-- Kho dữ liệu -->
        <a href="kho-du-lieu.html"
           class="nav-link"
           data-page="archive">

            <span class="nav-icon">▣</span>

            <span class="nav-text">
                Kho dữ liệu
            </span>

        </a>


        <!-- Khám phá -->
        <a href="explore.html"
           class="nav-link"
           data-page="explore">

            <span class="nav-icon">◎</span>

            <span class="nav-text">
                Khám phá
            </span>

        </a>


        <!-- Tạo hồ sơ -->
        <a href="create.html"
           class="nav-link"
           data-page="create">

            <span class="nav-icon">♢</span>

            <span class="nav-text">
                Tạo hồ sơ
            </span>

        </a>


        <!-- Bảng xếp hạng -->
        <a href="ranking.html"
           class="nav-link"
           data-page="ranking">

            <span class="nav-icon">♜</span>

            <span class="nav-text">
                Bảng xếp hạng
            </span>

        </a>


        <!-- Cộng đồng -->
        <a href="community.html"
           class="nav-link"
           data-page="community">

            <span class="nav-icon">♧</span>

            <span class="nav-text">
                Cộng đồng
            </span>

        </a>

    </nav>


    <!-- =========================
         KHU VỰC NGƯỜI DÙNG
    ========================== -->
    <div class="top-actions">


        <!-- Thông báo -->
        <button
            class="header-button notification-button"
            id="notificationButton"
            type="button"
            title="Thông báo">

            <span class="header-icon">
                ♧
            </span>

            <!-- Số thông báo -->
            <span
                class="notification-count"
                id="notificationCount">

                3

            </span>

        </button>


        <!-- =========================
             THÔNG TIN NGƯỜI DÙNG
        ========================== -->
        <a href="profile.html"
           class="user-profile">

            <!-- Avatar -->
            <div class="user-avatar">

                <img
                    src="assets/images/default-avatar.png"
                    alt="Avatar"
                    id="headerAvatar"
                    onerror="this.style.display='none'; this.nextElementSibling.style.display='grid';"
                >

                <!-- Avatar dự phòng -->
                <span class="avatar-fallback">
                    K
                </span>

            </div>


            <!-- Tên + cấp -->
            <div class="user-info">

                <strong id="headerUsername">
                    Kenya
                </strong>

                <small>
                    Điều tra viên •
                    <span id="headerLevel">
                        Cấp III
                    </span>
                </small>

            </div>

        </a>


        <!-- =========================
             DANH TIẾNG
        ========================== -->
        <div
            class="header-stat"
            title="Danh tiếng">

            <span class="stat-icon">
                ✧
            </span>

            <div>

                <small>
                    Danh tiếng
                </small>

                <strong id="headerReputation">
                    4.820
                </strong>

            </div>

        </div>


        <!-- =========================
             HỒ SƠ ĐÃ XÁC MINH
        ========================== -->
        <div
            class="header-stat"
            title="Hồ sơ đã xác minh">

            <span class="stat-icon">
                ▣
            </span>

            <div>

                <small>
                    Hồ sơ xác minh
                </small>

                <strong id="headerVerified">
                    128
                </strong>

            </div>

        </div>


        <!-- =========================
             CÀI ĐẶT
        ========================== -->
        <a
            href="settings.html"
            class="header-button settings-button"
            title="Cài đặt">

            <span class="header-icon">
                ⚙
            </span>

        </a>

    </div>

</header>
